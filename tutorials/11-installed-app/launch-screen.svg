  <g fill="#f7f7f4">
    <rect x="566" y="648" width="16" height="122"/>
    <rect x="562" y="640" width="24" height="10" rx="3"/>
    <rect x="668" y="648" width="16" height="122"/>
    <rect x="664" y="640" width="24" height="10" rx="3"/>
