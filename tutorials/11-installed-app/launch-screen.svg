    <path d="M486 319 L493 326 L503 312" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="526" y="312" width="140" height="14" rx="7" fill="#1a1a18" opacity="0.22"/>
  </g>
