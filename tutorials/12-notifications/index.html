<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punch List — CharmIQ Tutorial</title>
</head>
<body>
  <!-- the waiting screen, from first paint until the list is live (SEE: App.tsx): the
       header over the list assembling itself, its crew's jobs ticking off in turn. It is
       markup and CSS alone, so it moves before any script runs; nothing in it takes a tap -->
  <div id="waiting" class="app" aria-busy="true">
    <header>
      <h1>Punch List</h1>
    </header>
    <ul class="assembling" aria-hidden="true">
      <li style="--i: 0; --crew: #e5484d; --w: 74%"><span class="bar"></span><span class="box"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="line"></span></li>
      <li style="--i: 1; --crew: #2f6bff; --w: 58%"><span class="bar"></span><span class="box"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="line"></span></li>
      <li style="--i: 2; --crew: #1f9d55; --w: 82%"><span class="bar"></span><span class="box"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="line"></span></li>
      <li style="--i: 3; --crew: #8e52e0; --w: 49%"><span class="bar"></span><span class="box"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="line"></span></li>
      <li style="--i: 4; --crew: #e07b00; --w: 66%"><span class="bar"></span><span class="box"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="line"></span></li>
    </ul>
    <p class="opening" role="status">Opening…</p>
  </div>
  <div id="root"></div>
</body>
</html>
