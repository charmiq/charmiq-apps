<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Workshop Manager</title>
<style>
/* Workshop Manager — roster + template-Folder cloning, on the shared app design tokens */
/* ******************************************************************************** */
/* == Tokens ====================================================================== */
:root {
  --primary: #4A90E2;
  --primary-light: #e7f3ff;
  --danger: #d32f2f;
  --danger-light: #fdecea;
  --warn: #b45309;
  --warn-light: #fef3c7;
  --success: #15803d;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
}

/* == Reset ======================================================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 16px;
  background: var(--gray-50);
  color: var(--gray-900);
  font-size: 14px;
  overflow: hidden/*the table region is the only scroller*/;
}

/* == Layout ====================================================================== */
.container { max-width: 1100px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.card {
  background: white;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  overflow: visible;
}
.card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-header h2 { font-size: 16px; font-weight: 600; }
.card-body { padding: 16px 20px; }

/* == Buttons / inputs ============================================================ */
button {
  font: inherit;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding: 7px 14px;
  background: var(--gray-100);
  color: var(--gray-800);
}
button:hover { background: var(--gray-200); }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { background: var(--primary); color: white; }
button.primary:hover:not(:disabled) { background: #3a7bc8; }
button.danger { background: var(--danger); color: white; }
button.danger:hover:not(:disabled) { background: #b02724; }
button.icon {
  padding: 4px;
  background: transparent;
  display: inline-flex;
  align-items: center;
  color: var(--gray-500);
}
button.icon:hover { background: var(--gray-100); color: var(--gray-800); }
button.small { padding: 4px 10px; font-size: 13px; }

input[type="text"] {
  font: inherit;
  padding: 7px 10px;
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  width: 100%;
  background: white;
}
input[type="text"]:focus { outline: 2px solid var(--primary-light); border-color: var(--primary); }

svg.mi { width: 18px; height: 18px; fill: currentColor; vertical-align: middle; }

/* truncation discipline: a name never wraps — fixed width, ellipsis, and the full
   value rides a title tooltip at every use site */
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* == Config rows ================================================================= */
.config-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--gray-100);
}
.config-row:last-child { border-bottom: none; }
.config-label { width: 170px; flex-shrink: 0; font-weight: 600; color: var(--gray-600); }
.config-value { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; }
.config-value .name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
/* floats over the row — editing never shifts the layout */
.edit-popover {
  position: absolute;
  top: 2px;
  left: 180px;
  right: 0;
  z-index: 60;
  background: white;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  padding: 10px 12px;
}
a.folder-link {
  color: var(--primary);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}
a.folder-link:hover { text-decoration: underline; }
.unset { color: var(--warn); font-style: italic; }
.config-edit { flex: 1 1 auto; display: flex; gap: 8px; align-items: center; }
.hint { font-size: 12px; color: var(--gray-500); margin-top: 4px; }
.inline-error { font-size: 12px; color: var(--danger); margin-top: 4px; }

/* == Chips (owners) ============================================================== */
/* every control in the row — chip, picker input, buttons — shares one height, so
   swapping the Add Owner button for the picker never changes the row's height */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips button.small, .chips input[type="text"] { height: 30px; }
.chips input[type="text"] { padding: 0 10px; font-size: 13px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  background: var(--gray-100);
  border-radius: 999px;
  padding: 0 6px 0 10px;
  font-size: 13px;
  max-width: 280px;
}
.chip .icon svg.mi { width: 16px; height: 16px; }
.chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip .chip-email { color: var(--gray-500); }

/* == Roster table ================================================================ */
/* the roster card takes whatever height the configuration card leaves — collapsing
 * the configuration hands its space to the table, reopening takes it back. The
 * table region grows with content up to that space then scrolls (sticky header),
 * so the page itself never becomes a second scroller; a short roster keeps the
 * add row hugged to the table. Separate borders: collapsed borders do not stick
 * with a sticky header */
.roster-card { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
.roster-card .card-body { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
.table-scroll { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed/*percent columns hold — long names truncate instead of stretching the column*/; }
th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: white;
  text-align: left;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--gray-500);
  padding: 8px 10px;
  border-bottom: 1px solid var(--gray-200);
  cursor: pointer;
  user-select: none;
}
th:hover { color: var(--gray-800); }
th svg.mi { width: 14px; height: 14px; }
td { padding: 10px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
tr.deleted td { color: var(--gray-400); }
.student-name { display: block; }
tr.deleted .student-name { text-decoration: line-through; }
td .sub { font-size: 12px; color: var(--gray-500); }
tr.deleted td .sub { color: var(--gray-400); }
.status-cloned { color: var(--success); }
.status-outofsync { color: var(--warn); font-weight: 600; }
.status-progress { color: var(--primary); }
/* the status cell renders main + sub lines in every state so switching between
   not-cloned / syncing / cloned never changes the row's height */
td .status-main { min-height: 20px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }

/* the row stands at the selected-user card's height from the start — picking a
   user never changes the row's height; single-line controls center within it */
.add-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
/* min-width: 0 — a flex item's default min-content width would let a long name
   stretch the field instead of truncating inside it */
.add-row .field { flex: 1 1 0; min-width: 0; position: relative; height: 46px; display: flex; align-items: center; }
.add-row .field input[type="text"] { height: 34px; }
.add-row > button { height: 34px; flex-shrink: 0; white-space: nowrap; }
.add-row .selected-user { height: 100%; width: 100%; min-width: 0; }

/* == Typeahead =================================================================== */
.typeahead-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: 100%;
  max-height: 320px;
  overflow-y: auto;
  background: white;
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  z-index: 50;
  padding: 6px 4px;
}
.typeahead-section { font-size: 12px; font-weight: 600; color: var(--gray-500); padding: 4px 8px; }
.typeahead-item { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.typeahead-item:hover, .typeahead-item.focused { background: var(--gray-100); }
.typeahead-item img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.typeahead-item .avatar-fallback {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  background: var(--primary-light); color: var(--primary);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
}
/* every .who block (typeahead items, the selected-user card) truncates its lines */
.who { min-width: 0; }
.who .n, .who .e { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .e { font-size: 12px; color: var(--gray-500); }
.typeahead-empty { padding: 6px 8px; color: var(--gray-500); font-size: 13px; }
.selected-user {
  display: flex; align-items: center; gap: 8px;
  background: var(--primary-light);
  border-radius: 6px;
  padding: 6px 10px;
}
.selected-user .who { min-width: 0; flex: 1 1 auto; }

/* == Modal ======================================================================= */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(17, 24, 39, 0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal {
  background: white;
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  width: min(480px, calc(100vw - 32px));
  overflow: hidden;
}
.modal-header { padding: 14px 20px; font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--gray-200); }
.modal.loud .modal-header { background: var(--danger-light); color: var(--danger); }
.modal-body { padding: 16px 20px; color: var(--gray-700); line-height: 1.5; }
.modal-body .type-confirm { margin-top: 12px; }
.modal-footer { padding: 12px 20px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--gray-200); }

/* == Banner / toast ============================================================== */
.banner {
  border-radius: 8px;
  padding: 12px 16px;
  background: var(--warn-light);
  color: var(--warn);
  line-height: 1.5;
}
.banner.error { background: var(--danger-light); color: var(--danger); }
#toasts {
  position: fixed; right: 16px; bottom: 16px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 200;
  max-width: 380px;
}
.toast {
  background: var(--gray-800); color: white;
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 13px;
  line-height: 1.4;
}
.toast.error { background: var(--danger); }
.toast button.icon { color: rgba(255, 255, 255, 0.8); flex-shrink: 0; }
.toast button.icon:hover { background: rgba(255, 255, 255, 0.15); color: white; }
</style>
</head>
<body>
  <div class="container" id="app"></div>
  <div id="toasts"></div>

<script>
(() => {
'use strict';

// Workshop Manager
// Two configured Folders (Template, Classroom), a student roster, and per-student
// cloning of the Template tree with an incremental re-clone (additions only). All
// state rides app-state; the template→copy mapping per student is the re-clone index.
// ********************************************************************************
// == Constants ===================================================================
const CHARMIQ_URI_SCHEME = 'charmiq://';
// URI scopes that copy via the richtext.copy Command; folders recurse; anything
// else (assets, platform pages, agent tasks) is reported as skipped
const RICHTEXT_SCOPES = new Set(['workspace', 'charm', 'chat', 'source']);
const SHARE_ROLES = new Set(['owner', 'manager', 'editor', 'commenter', 'viewer']);
const DEFAULT_PATTERN = 'Workshop — {name}';
const LIST_PAGE_LIMIT = 100;
const LIST_PAGE_CAP = 50;
const TYPEAHEAD_LIMIT = 5;
const TYPEAHEAD_DEBOUNCE_MS = 200;
const OBSERVABLE_TIMEOUT_MS = 8000;

const ICONS = {
  edit: 'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z',
  openInNew: 'M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z',
  close: 'M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  expandLess: 'M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14l-6-6z',
  expandMore: 'M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z',
  delete: 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
};

// == State =======================================================================
// persisted (app-state) — SEE: normalizeState() for the authoritative shape
let state = null;
let lastWrittenJson = null;

// session-only UI state
let services = { command: null, userProfile: null, authUser: null };
let authState = null;
let configCollapsed = false/*boot: collapsed iff app-state already exists*/;
let editingField = null/*'template' | 'classroom' | 'pattern' | null*/;
let editError = null;
let busyStudentId = null/*one clone at a time*/;
let progressText = new Map()/*studentId → status line*/;
let addStudent = { name: '', user: null/*{userId, name, email}*/ };
let ownerPickerOpen = false;
let sort = { key: 'name', dir: 1/*ascending*/ };

const defaultState = () => ({
  config: {
    templateFolderId: null, templateFolderName: null,
    classroomFolderId: null, classroomFolderName: null,
    folderNamePattern: DEFAULT_PATTERN,
    owners: [],
  },
  students: [],
});

const normalizeState = (raw) => {
  const base = defaultState();
  if(!raw || typeof raw !== 'object') return base;
  const config = { ...base.config, ...(raw.config && typeof raw.config === 'object' ? raw.config : {}) };
  if(!Array.isArray(config.owners)) config.owners = [];
  const students = (Array.isArray(raw.students) ? raw.students : []).map(s => ({
    id: s.id, name: s.name || '', userId: s.userId || null, email: s.email || '',
    profileName: s.profileName || '',
    deleted: s.deleted === true,
    folderId: s.folderId || null, folderName: s.folderName || null,
    clonedAt: s.clonedAt || null,
    mapping: (s.mapping && typeof s.mapping === 'object') ? s.mapping : {},
  })).filter(s => s.id);
  return { config, students };
};

// == Utilities ===================================================================
const esc = (value) => String(value ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const icon = (name) => `<svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;

const generateId = () => 'st_' + (window.crypto?.randomUUID?.() ?? (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)));

// the embedding platform page's origin serves folder links; the referrer is that page
const platformOrigin = () => {
  try { if(document.referrer) return new URL(document.referrer).origin; } catch { /* fall through */ }
  return 'https://team.charmiq.ai';
};
const folderUri = (folderId) => `${CHARMIQ_URI_SCHEME}folder/${folderId}`;
const folderWebUrl = (folderId) => `${platformOrigin()}/folder/${folderId}`;
const uriScope = (uri) => { const rest = String(uri || '').slice(CHARMIQ_URI_SCHEME.length); return rest.slice(0, rest.indexOf('/')); };
const uriId = (uri) => { const rest = String(uri || '').slice(CHARMIQ_URI_SCHEME.length); return rest.slice(rest.indexOf('/') + 1).split(/[?#]/)[0]; };

// accepts a web URL (…/folder/<id>), a charmiq://folder/<id> URI, or a bare id
const parseFolderRef = (input) => {
  const trimmed = String(input || '').trim();
  if(!trimmed) return null;
  const webMatch = trimmed.match(/\/folder\/([A-Za-z0-9_-]+)/);
  if(webMatch) return webMatch[1];
  if(trimmed.startsWith(CHARMIQ_URI_SCHEME)) return uriScope(trimmed) === 'folder' ? uriId(trimmed) : null;
  if(/^[A-Za-z0-9_-]{15,}$/.test(trimmed)) return trimmed;
  return null;
};

const formatDate = (iso) => {
  if(!iso) return '';
  try { return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch { return iso; }
};

const displayName = (profile) => {
  const name = [profile?.firstName, profile?.lastName].filter(Boolean).join(' ').trim();
  return name || profile?.username || profile?.email || '(unnamed)';
};

// first emission of a bridge observable as a Promise
const firstEmission = (observable, timeoutMs = OBSERVABLE_TIMEOUT_MS) => new Promise((resolve, reject) => {
  let settled = false;
  let subscription = null;
  const finish = (fn, value) => {
    if(settled) return;
    settled = true;
    clearTimeout(timer);
    try { subscription?.unsubscribe?.(); } catch { /* disposed */ }
    fn(value);
  };
  const timer = setTimeout(() => finish(reject, new Error('Timed out waiting for the platform')), timeoutMs);
  try {
    subscription = observable.subscribe({
      next: (value) => finish(resolve, value),
      error: (error) => finish(reject, error),
    });
    if(settled) { try { subscription?.unsubscribe?.(); } catch { /* disposed */ } }
  } catch(error) { finish(reject, error); }
});

// MCP tool results may arrive structured, wrapped, or as text content
const normalizeToolResult = (result) => {
  if(result == null) return {};
  if(result.structuredContent && typeof result.structuredContent === 'object') return result.structuredContent;
  if(Array.isArray(result.content)) {
    const text = result.content.filter(c => c && c.type === 'text').map(c => c.text).join('\n');
    try { return JSON.parse(text); } catch { return { text }; }
  } /* else -- unstructured, non-array content */
  return result;
};

// == Platform calls ==============================================================
const callVfs = async (tool, args) => normalizeToolResult(await window.charmiq.mcp.callTool('vfs', tool, args));

const execCommand = async (id, args) => {
  if(!services.command) throw new Error('The Command service is unavailable — reload the page');
  return await services.command.execute({ id, args });
};

const listDirAll = async (uri) => {
  const entries = [];
  let offset = 0;
  for(let page=0; page<LIST_PAGE_CAP; page++) {
    const result = await callVfs('list_dir', { uri, limit: LIST_PAGE_LIMIT, offset });
    const pageEntries = Array.isArray(result.entries) ? result.entries : [];
    entries.push(...pageEntries);
    if(!result.hasMore || (pageEntries.length < 1)) return entries;
    offset += pageEntries.length;
  }
  throw new Error(`Folder listing exceeded ${LIST_PAGE_CAP * LIST_PAGE_LIMIT} entries`);
};

const describeUri = async (uri, verbose = false) => await callVfs('describe_file', verbose ? { uri, verbose: true } : { uri });

const resolveFolderName = async (folderId) => {
  const described = await describeUri(folderUri(folderId));
  if(typeof described.name === 'string' && described.name.trim()) return described.name.trim();
  if(typeof described.text === 'string') { const line = described.text.split('\n')[0]; if(line) return line; }
  return folderId;
};

// existing guest shares on a Folder (defensive across result shapes); merged back
// on permission.set since that Command replaces the complete map
const readFolderShares = async (folderId) => {
  try {
    const described = await describeUri(folderUri(folderId), true/*verbose — includes shares*/);
    const shares = described.shares;
    let pairs = [];
    if(Array.isArray(shares)) pairs = shares.map(s => [s.userId ?? s.user ?? s.id, s.role]);
    else if(shares && typeof shares === 'object') pairs = Object.entries(shares).map(([userId, value]) => [userId, typeof value === 'string' ? value : value?.role]);
    return pairs.filter(([userId, role]) => userId && SHARE_ROLES.has(role));
  } catch { return []; }
};

// == Persistence =================================================================
// fetch-merge-set: every write re-reads current state and applies a targeted
// mutation so concurrent writers only lose at the whole-blob boundary
const persist = async (mutate) => {
  const fetched = normalizeState(await window.charmiq.appState.get());
  const next = mutate(fetched) || fetched;
  lastWrittenJson = JSON.stringify(next);
  await window.charmiq.appState.set(next);
  state = next;
  render();
};

const replaceStudent = (students, updated) => students.map(s => s.id === updated.id ? updated : s);

const anyClones = () => state.students.some(s => !s.deleted && Object.keys(s.mapping).length > 0);

// mirror of the platform's hasRole: Admin implies every role
const hasUserRole = (role) => {
  const roles = authState?.userRoles ?? {};
  return (roles['admin'/*UserRole.Admin*/] === true) || (roles[role] === true);
};
// the server enforces the role on admin.agent.create — this gate is visibility only
const canImportCharms = () => hasUserRole('daa'/*UserRole.DefaultAgentAdmin*/);

// cloning requires both configured Folders and they must differ (a template cloned
// into itself compounds on every re-clone); the roster banner and the per-row Clone
// buttons key off the same predicate. Either Folder may still be SET freely — the
// problem reports at the cloning surface, not the pencil
const configProblem = () => {
  if(!state.config.templateFolderId || !state.config.classroomFolderId) return { message: 'Set the Template and Classroom Folders above before cloning.', severity: 'warn' };
  if(state.config.templateFolderId === state.config.classroomFolderId) return { message: 'The Template and Classroom Folders are the same — cloning would copy the template into itself. Set them to different Folders.', severity: 'error' };
  return null;
};

// == Toasts ======================================================================
const toast = (message, { error = false } = {}) => {
  const el = document.createElement('div');
  el.className = 'toast' + (error ? ' error' : '');
  el.innerHTML = `<div style="flex:1 1 auto; min-width:0;">${esc(message)}</div><button class="icon" title="Dismiss">${icon('close')}</button>`;
  el.querySelector('button').addEventListener('click', () => el.remove());
  document.getElementById('toasts').appendChild(el);
  if(!error) setTimeout(() => el.remove(), 6000);
};

// == Confirm modal ===============================================================
// loud mode renders the danger header and requires typing the confirmation word
const confirmModal = ({ title, bodyHtml, confirmLabel = 'Confirm', cancelLabel = 'Cancel', loud = false, typeToConfirm = null }) => new Promise((resolve) => {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal${loud ? ' loud' : ''}">
      <div class="modal-header">${esc(title)}</div>
      <div class="modal-body">
        ${bodyHtml}
        ${typeToConfirm ? `<div class="type-confirm"><input type="text" placeholder="Type &quot;${esc(typeToConfirm)}&quot; to confirm"></div>` : ''}
      </div>
      <div class="modal-footer">
        <button data-action="cancel">${esc(cancelLabel)}</button>
        <button data-action="confirm" class="${loud ? 'danger' : 'primary'}" ${typeToConfirm ? 'disabled' : ''}>${esc(confirmLabel)}</button>
      </div>
    </div>`;
  const confirmButton = overlay.querySelector('[data-action="confirm"]');
  const input = overlay.querySelector('.type-confirm input');
  if(input) input.addEventListener('input', () => { confirmButton.disabled = input.value.trim().toLowerCase() !== typeToConfirm.toLowerCase(); });
  const close = (value) => { overlay.remove(); resolve(value); };
  overlay.querySelector('[data-action="cancel"]').addEventListener('click', () => close(false));
  confirmButton.addEventListener('click', () => close(true));
  overlay.addEventListener('click', (event) => { if(event.target === overlay) close(false); });
  document.body.appendChild(overlay);
  (input ?? confirmButton).focus();
});

// == User typeahead ==============================================================
// mirrors the platform's user search sections: active-Organization Members, Teams,
// and an exact-email fall-through when the scoped sections come up empty
const searchProfiles = async (filter) => {
  if(!services.userProfile) return [];
  const tuples = await firstEmission(services.userProfile.typeaheadSearchProfiles$(filter));
  return Array.isArray(tuples) ? tuples : [];
};

// distinguishes empty results from a search that could not run at all: a service
// call denied by the bridge (the user-search method is not exposed, or consent was
// refused) must never render as "no user found"
const searchUserSections = async (query) => {
  const sections = [];
  let attempts = 0, failures = 0;
  const trySection = async (label, filter, pick = (tuples) => tuples) => {
    attempts++;
    try {
      const tuples = pick(await searchProfiles(filter));
      if(tuples.length) sections.push({ label, tuples });
    } catch { failures++; }
  };
  const organizationId = authState?.activeOrg?.id ?? null;
  const teamIds = authState?.profilePrivate?.favoriteTeamIds ?? null;
  if(organizationId) await trySection('Organization', { query, organizationId, limit: TYPEAHEAD_LIMIT });
  if(Array.isArray(teamIds) && (teamIds.length > 0)) await trySection('Teams', { query, teamIds, limit: TYPEAHEAD_LIMIT });
  // exact-email fall-through: an unscoped search filtered to the exact address
  if(sections.length < 1) await trySection('Exact email match', { query, limit: TYPEAHEAD_LIMIT * 2 }, tuples => tuples.filter(({ obj }) => obj?.email === query));
  return { sections, unavailable: (attempts > 0) && (failures === attempts) };
};

const attachUserTypeahead = (input, menu, onSelect) => {
  let debounceTimer = null;
  let requestSequence = 0;
  const closeMenu = () => { menu.style.display = 'none'; menu.innerHTML = ''; };
  const renderMenu = ({ sections, unavailable }, query) => {
    if(!query) { closeMenu(); return; }
    menu.style.display = 'block';
    if(unavailable) {
      menu.innerHTML = `<div class="typeahead-empty">User search is unavailable — the platform has not exposed user search to this application</div>`;
      return;
    }
    if(sections.length < 1) {
      menu.innerHTML = `<div class="typeahead-empty">No Platform User found${query.includes('@') ? '' : ' — try the exact email address'}</div>`;
      return;
    }
    menu.innerHTML = sections.map(section => `
      <div class="typeahead-section">${esc(section.label)}</div>
      ${section.tuples.map(({ id, obj }) => `
        <div class="typeahead-item" data-user-id="${esc(id)}" data-name="${esc(displayName(obj))}" data-email="${esc(obj?.email || '')}">
          ${obj?.profileImageUrl
            ? `<img src="${esc(obj.profileImageUrl)}" alt="">`
            : `<span class="avatar-fallback">${esc(displayName(obj).slice(0, 1).toUpperCase())}</span>`}
          <div class="who"><div class="n" title="${esc(displayName(obj))}">${esc(displayName(obj))}</div><div class="e" title="${esc(obj?.email || '')}">${esc(obj?.email || '')}</div></div>
        </div>`).join('')}
    `).join('');
    menu.querySelectorAll('.typeahead-item').forEach(item => {
      item.addEventListener('mousedown', (event) => {
        event.preventDefault()/*keep the input's focus*/;
        closeMenu();
        onSelect({ userId: item.dataset.userId, name: item.dataset.name, email: item.dataset.email });
      });
    });
  };
  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = input.value.trim();
    if(!query) { closeMenu(); return; }
    debounceTimer = setTimeout(async () => {
      const sequence = ++requestSequence;
      const result = await searchUserSections(query);
      if(sequence !== requestSequence) return/*superseded*/;
      renderMenu(result, query);
    }, TYPEAHEAD_DEBOUNCE_MS);
  });
  input.addEventListener('keydown', (event) => {
    if(event.key === 'Escape') closeMenu();
    if(event.key === 'Enter') {
      const first = menu.querySelector('.typeahead-item');
      if(first) {
        closeMenu();
        onSelect({ userId: first.dataset.userId, name: first.dataset.name, email: first.dataset.email });
      } /*else -- no selection */
      event.preventDefault();
    } /* else -- not 'Enter' */
  });
  input.addEventListener('blur', () => setTimeout(closeMenu, 150)/*allow item mousedown first*/);
};

// == Template walk ===============================================================
// BFS from the Template root, parents before children. Returns folders and
// documents (with parent template-URIs) plus entries of uncopyable scopes
const walkTemplate = async (templateFolderId) => {
  const rootUri = folderUri(templateFolderId);
  const folders = []/*{uri, name, parentUri}*/;
  const docs = []/*{uri, name, parentUri}*/;
  const skipped = []/*{uri, name}*/;
  const queue = [rootUri];
  while(queue.length > 0) {
    const parentUri = queue.shift();
    const entries = await listDirAll(parentUri);
    for(const entry of entries) {
      const scope = uriScope(entry.uri);
      if(scope === 'folder') {
        folders.push({ uri: entry.uri, name: entry.name.replace(/\/$/, ''), parentUri });
        queue.push(entry.uri);
      } else if(RICHTEXT_SCOPES.has(scope)) {
        docs.push({ uri: entry.uri, name: entry.name, parentUri });
      } else {
        skipped.push({ uri: entry.uri, name: entry.name });
      }
    }
  }
  return { rootUri, folders, docs, skipped };
};

// == Clone engine ================================================================
const setProgress = (studentId, text) => {
  if(text === null) progressText.delete(studentId); else progressText.set(studentId, text);
  render();
};

// the copy Command returns the new RichtextIdentifier (shape-tolerant on the wire)
const copyIdentifier = (result) => {
  if(typeof result === 'string') return result;
  if(result && (typeof result === 'object')) return result.richtextId ?? result.id ?? null;
  return null;
};

// a copy carries the source's type, so the copy's URI shares the template's scope
const copyUri = (templateUri, copyId) => `${CHARMIQ_URI_SCHEME}${uriScope(templateUri)}/${copyId}`;

// bridge/tool errors carry the platform error code in the message text
const isPermissionDeniedError = (error) => /permission[- ]denied/i.test(String(error?.message ?? error));
const isGoneError = (error) => /not[- ]found|deleted/i.test(String(error?.message ?? error));

// the copy's live state drives recreate / move / edit decisions. 'gone' is claimed
// only on a recognized not-found — an unknown failure must never trigger a
// recreate (a transient error would duplicate a live copy)
const describeCopyState = async (uri) => {
  try {
    const described = await describeUri(uri);
    return { state: 'ok', version: (typeof described.version === 'number') ? described.version : 0, name: (typeof described.name === 'string') ? described.name : null };
  } catch(error) {
    if(isPermissionDeniedError(error)) return { state: 'unreachable' };
    if(isGoneError(error)) return { state: 'gone' };
    return { state: 'error', message: String(error?.message ?? error) };
  }
};

const createStudentFolder = async (student) => {
  const name = state.config.folderNamePattern.replaceAll('{name}', student.name);
  const created = await callVfs('create_dir', { uri: folderUri(state.config.classroomFolderId), name });
  const folderId = created.folderId ?? (created.uri ? uriId(created.uri) : null);
  if(!folderId) throw new Error('Folder creation returned no id');

  // one permission pass at creation: shares inherited from the Classroom folder are
  // merged back (permission.set replaces the complete map), then the configured
  // Owners and the student; later manual share edits are never touched again
  const permissions = {};
  for(const [userId, role] of await readFolderShares(folderId)) permissions[userId] = role;
  for(const owner of state.config.owners) if(owner.userId) permissions[owner.userId] = 'owner';
  permissions[student.userId] = 'editor';
  await execCommand('folder.permission.set', { folderId, permissions, sendNotificationEmail: false, sendInviteExternalEmail: false });

  return { ...student, folderId, folderName: name };
};

const ensureStudentFolder = async (student, report) => {
  if(student.folderId) {
    const live = await describeCopyState(folderUri(student.folderId));
    if(live.state === 'ok') return student;
    if(live.state !== 'gone') throw new Error(`The student folder is not accessible (${live.state === 'unreachable' ? 'permission denied' : live.message})`);
    report.recreated++/*student deleted their folder — fresh one, contents recreate per item*/;
  } /* else -- never created */
  return await createStudentFolder(student);
};

// full sync per student: additions, admin moves, admin edits, admin deletes, and
// recreates of student-deleted copies — the mapping resolves everything by id, so
// student placement never blocks an operation and never loses a copy
const cloneStudent = async (studentId) => {
  if(busyStudentId) return;
  const original = state.students.find(s => s.id === studentId);
  if(!original || original.deleted) return;
  const problem = configProblem();
  if(problem) { toast(problem.message, { error: true }); return; }

  busyStudentId = studentId;
  const mapping = { ...original.mapping };
  let student = { ...original, mapping };
  const report = { added: 0, moved: 0, updated: 0, recreated: 0, removed: 0, leftAlone: [], keptFolders: [], outOfReach: [], failed: [] };
  let skippedEntries = [];
  try {
    setProgress(studentId, 'Reading template…');
    const walk = await walkTemplate(state.config.templateFolderId);
    skippedEntries = walk.skipped;

    student = await ensureStudentFolder(student, report);
    // persist the created folder immediately so a later failure cannot orphan it
    if(student.folderId !== original.folderId) {
      await persist(s => { s.students = replaceStudent(s.students, { ...student, mapping: { ...mapping } }); return s; });
    } /* else -- folder already existed, no need to persist yet */

    // the id of the student-side parent for a template-side parent URI
    const copyParentId = (templateParentUri) =>
      templateParentUri === walk.rootUri ? student.folderId : mapping[templateParentUri]?.copyId;
    const entryKind = (uri, entry) => entry.kind ?? (uriScope(uri) === 'folder' ? 'folder' : 'doc');
    // a fresh copy starts at version zero: the baseline is implicitly 0 and
    // overwrites re-baseline with the post-write version
    const studentEdited = (entry, liveVersion) => liveVersion > (entry.copyVersion ?? 0);

    const walkUris = new Set([...walk.folders.map(f => f.uri), ...walk.docs.map(d => d.uri)]);
    const removedUris = Object.keys(mapping).filter(uri => !walkUris.has(uri));
    const total = walk.folders.length + walk.docs.length + removedUris.length;
    let processed = 0;
    const step = () => setProgress(studentId, `Syncing… ${++processed}/${total}`);
    const itemFailed = (name, error) => {
      if(isPermissionDeniedError(error)) report.outOfReach.push(name);
      else report.failed.push(`${name}: ${error?.message ?? error}`);
    };

    const createFolderCopy = async (folder) => {
      const parentId = copyParentId(folder.parentUri);
      if(!parentId) throw new Error('no cloned parent folder');
      const created = await callVfs('create_dir', { uri: folderUri(parentId), name: folder.name });
      const copyId = created.folderId ?? (created.uri ? uriId(created.uri) : null);
      if(!copyId) throw new Error('folder creation returned no id');
      mapping[folder.uri] = { copyId, kind: 'folder', parentUri: folder.parentUri, clonedAt: new Date().toISOString() };
    };
    const createDocCopy = async (doc) => {
      const parentId = copyParentId(doc.parentUri);
      if(!parentId) throw new Error('no cloned parent folder');
      // record which template version was copied (best-effort; drives edit sync)
      let templateVersion = null;
      try { const described = await describeUri(doc.uri); if(typeof described.version === 'number') templateVersion = described.version; } catch { /* version stays null */ }
      // shallow copy: Comments are never cloned. copyToParentFolder must be an
      // explicit false — the shallow path's default would land the copy in the
      // source's parent (the template folder) instead of the student's
      const result = await execCommand('richtext.copy', { richtextId: uriId(doc.uri), parentFolderId: parentId, copyToParentFolder: false, preserveContextDependents: true });
      const copyId = copyIdentifier(result);
      if(!copyId) throw new Error('copy returned no id');
      mapping[doc.uri] = { copyId, kind: 'doc', parentUri: doc.parentUri, templateVersion, clonedAt: new Date().toISOString() };
    };

    // -- template folders: additions, recreates, admin-move mirroring ------------
    // (BFS order: parents precede children, so move targets exist when needed)
    for(const folder of walk.folders) {
      step();
      try {
        const entry = mapping[folder.uri];
        if(!entry) { await createFolderCopy(folder); report.added++; continue; }
        // entries cloned before parentUri was recorded learn it here — template
        // moves from before that recording are amnestied
        if(!entry.parentUri) { mapping[folder.uri] = { ...entry, parentUri: folder.parentUri }; continue; }

        const live = await describeCopyState(folderUri(entry.copyId));
        if(live.state === 'unreachable') { report.outOfReach.push(folder.name); continue; }
        if(live.state === 'error') { report.failed.push(`${folder.name}: ${live.message}`); continue; }
        if(live.state === 'gone') { await createFolderCopy(folder); report.recreated++; continue; }

        if(entry.parentUri !== folder.parentUri) {
          // admin moved the folder in the template — admin placement wins
          const parentId = copyParentId(folder.parentUri);
          if(!parentId) throw new Error('no cloned parent folder');
          await callVfs('move', { uri: folderUri(entry.copyId), destination: folderUri(parentId) });
          mapping[folder.uri] = { ...entry, parentUri: folder.parentUri };
          report.moved++;
        } /* else -- placement unchanged */
      } catch(error) { itemFailed(folder.name, error); }
    }

    // -- template documents: additions, recreates, moves, edit sync --------------
    for(const doc of walk.docs) {
      step();
      try {
        const entry = mapping[doc.uri];
        if(!entry) { await createDocCopy(doc); report.added++; continue; }
        if(!entry.parentUri) { mapping[doc.uri] = { ...entry, parentUri: doc.parentUri }; continue; }/*amnesty, as folders*/

        const live = await describeCopyState(copyUri(doc.uri, entry.copyId));
        if(live.state === 'unreachable') { report.outOfReach.push(doc.name); continue; }
        if(live.state === 'error') { report.failed.push(`${doc.name}: ${live.message}`); continue; }
        if(live.state === 'gone') { await createDocCopy(doc); report.recreated++; continue; }

        let current = mapping[doc.uri];
        if(current.parentUri !== doc.parentUri) {
          // admin moved the document — admin placement wins
          const parentId = copyParentId(doc.parentUri);
          if(!parentId) throw new Error('no cloned parent folder');
          await callVfs('move', { uri: copyUri(doc.uri, current.copyId), destination: folderUri(parentId) });
          current = { ...current, parentUri: doc.parentUri };
          mapping[doc.uri] = current;
          report.moved++;
        } /* else -- placement unchanged */

        // edit sync: silent when the copy is untouched, prompted when it isn't
        const templateNow = await describeUri(doc.uri);
        const templateVersionNow = (typeof templateNow.version === 'number') ? templateNow.version : null;
        if(templateVersionNow === null) continue/*cannot compare this round*/;
        if(current.templateVersion == null) { mapping[doc.uri] = { ...current, templateVersion: templateVersionNow }; continue; }/*amnesty*/
        // templateVersion always remains the version the copy's CONTENT came
        // from (clone or last overwrite); a leave never touches it, and a
        // standing divergence re-asks on EVERY sync until resolved
        if(templateVersionNow > current.templateVersion) {
          let overwrite = true;
          if(studentEdited(current, live.version)) {
            overwrite = await confirmModal({
              title: 'Template changed — copy was edited',
              bodyHtml: `<p><strong>${esc(doc.name)}</strong> changed in the template, but the copy for <strong>${esc(student.name)}</strong> has been edited since it was cloned. Overwrite the copy with the template version, or leave it as is?</p>`,
              confirmLabel: 'Overwrite', cancelLabel: 'Leave it',
            });
          } /* else -- untouched copy updates silently */
          if(overwrite) {
            const templateContent = await callVfs('read_file', { uri: doc.uri });
            const written = await callVfs('write_file', { uri: copyUri(doc.uri, current.copyId), content: templateContent.content ?? '' });
            let baseline = (typeof written.versionIndex === 'number') ? written.versionIndex : null;
            if(baseline === null) { const after = await describeCopyState(copyUri(doc.uri, current.copyId)); if(after.state === 'ok') baseline = after.version; }
            const updated = {
              ...current,
              templateVersion: (typeof templateContent.version === 'number') ? templateContent.version : templateVersionNow,
              ...((baseline !== null) ? { copyVersion: baseline } : {}),
            };
            delete updated.outOfSync/*the copy matches the template again*/;
            delete updated.acknowledgedTemplateVersion;
            mapping[doc.uri] = updated;
            report.updated++;
          } else {
            const left = { ...current, outOfSync: true };
            delete left.acknowledgedTemplateVersion/*scrub the retired suppression field*/;
            mapping[doc.uri] = left;
            report.leftAlone.push(doc.name);
          }
        } /* else -- template unchanged since the content was last synced */
      } catch(error) { itemFailed(doc.name, error); }
    }

    // -- template removals (moved out and deleted are one case) ------------------
    // documents before folders so removed folders can empty out
    const removedDocs = removedUris.filter(uri => entryKind(uri, mapping[uri]) === 'doc');
    const removedFolders = removedUris.filter(uri => entryKind(uri, mapping[uri]) === 'folder');

    for(const uri of removedDocs) {
      step();
      const entry = mapping[uri];
      try {
        const live = await describeCopyState(copyUri(uri, entry.copyId));
        if(live.state === 'unreachable') { report.outOfReach.push(live.name ?? entry.copyId); continue; }
        if(live.state === 'error') { report.failed.push(`${entry.copyId}: ${live.message}`); continue; }
        if(live.state === 'gone') { delete mapping[uri]; continue; }/*both sides gone*/
        const name = live.name ?? entry.copyId;
        let doDelete = true;
        if(studentEdited(entry, live.version)) {
          doDelete = await confirmModal({
            title: 'Removed from template — copy was edited',
            bodyHtml: `<p><strong>${esc(name)}</strong> was removed from the template, but the copy for <strong>${esc(student.name)}</strong> has been edited. Delete the copy, or leave it (it stops being managed)?</p>`,
            confirmLabel: 'Delete copy', cancelLabel: 'Leave it',
          });
        } /* else -- untouched copy deletes silently */
        if(doDelete) { await callVfs('delete_file', { uri: copyUri(uri, entry.copyId) }); report.removed++; }
        else report.leftAlone.push(name);
        delete mapping[uri];
      } catch(error) { itemFailed(entry.copyId, error); }
    }

    // deepest-first by retry passes: a removed folder deletes only when empty;
    // student-created files are NEVER deleted — a folder holding any is kept and
    // reported loudly
    let pendingFolders = removedFolders;
    for(let pass = 0; (pass < 10) && (pendingFolders.length > 0); pass++) {
      const deferred = [];
      let progressed = false;
      for(const uri of pendingFolders) {
        if(pass === 0) step();
        const entry = mapping[uri];
        try {
          const live = await describeCopyState(folderUri(entry.copyId));
          if(live.state === 'unreachable') { report.outOfReach.push(live.name ?? entry.copyId); progressed = true; continue; }
          if(live.state === 'error') { report.failed.push(`${entry.copyId}: ${live.message}`); progressed = true; continue; }
          if(live.state === 'gone') { delete mapping[uri]; progressed = true; continue; }
          const contents = await listDirAll(folderUri(entry.copyId));
          if(contents.length > 0) { deferred.push({ uri, name: live.name ?? entry.copyId }); continue; }
          await execCommand('folder.delete', { folderId: entry.copyId });
          delete mapping[uri];
          report.removed++;
          progressed = true;
        } catch(error) { itemFailed(entry.copyId, error); progressed = true; }
      }
      if(!progressed) { pendingFolders = deferred.map(d => d.uri); report.keptFolders.push(...deferred.map(d => d.name)); pendingFolders.forEach(uri => delete mapping[uri]); break; }
      pendingFolders = deferred.map(d => d.uri);
      if(pendingFolders.length < 1) break;
      if(pass === 9) { report.keptFolders.push(...deferred.map(d => d.name)); pendingFolders.forEach(uri => delete mapping[uri]); }
    }

    student = { ...student, mapping, clonedAt: new Date().toISOString() };
    await persist(s => { s.students = replaceStudent(s.students, student); return s; });

    const parts = [];
    if(report.added) parts.push(`${report.added} added`);
    if(report.moved) parts.push(`${report.moved} moved`);
    if(report.updated) parts.push(`${report.updated} updated`);
    if(report.recreated) parts.push(`${report.recreated} recreated`);
    if(report.removed) parts.push(`${report.removed} removed`);
    if(report.leftAlone.length) parts.push(`${report.leftAlone.length} left as-is`);
    const skippedNote = skippedEntries.length ? ` (${skippedEntries.length} not copyable: ${skippedEntries.map(e => e.name).join(', ')})` : '';
    toast(`${student.name}: ${parts.length ? parts.join(', ') : 'up to date'}${skippedNote}`);
    if(report.keptFolders.length) toast(`${student.name}: folder${report.keptFolders.length === 1 ? '' : 's'} NOT deleted — holding files the workshop does not manage: ${report.keptFolders.join(', ')}`, { error: true });
    if(report.outOfReach.length) toast(`${student.name}: out of reach (permission denied): ${report.outOfReach.join(', ')}`, { error: true });
    if(report.failed.length) toast(`${student.name}: failed: ${report.failed.join('; ')}`, { error: true });
  } catch(error) {
    // keep whatever completed: the mapping is the sync index
    try { await persist(s => { s.students = replaceStudent(s.students, { ...student, mapping }); return s; }); } catch { /* the mapping write itself failed */ }
    toast(`${student.name}: sync failed — ${error?.message ?? error}`, { error: true });
  } finally {
    busyStudentId = null;
    setProgress(studentId, null);
  }
};

// == Config actions ==============================================================
const FOLDER_FIELDS = {
  template: { idKey: 'templateFolderId', nameKey: 'templateFolderName', label: 'Template Folder' },
  classroom: { idKey: 'classroomFolderId', nameKey: 'classroomFolderName', label: 'Classroom Folder' },
};

const changeFolderWarning = (field) => field === 'template'
  ? `<p>Changing the <strong>Template Folder</strong> abandons the existing clone index: every already-cloned item no longer matches, so the next re-clone copies the <strong>entire new template</strong> into every student folder alongside what is already there.</p>`
  : `<p>Changing the <strong>Classroom Folder</strong> only affects <strong>future</strong> clones. Folders already created for students stay where they are.</p>`;

const saveFolderEdit = async (field, rawValue) => {
  const spec = FOLDER_FIELDS[field];
  const folderId = parseFolderRef(rawValue);
  if(!folderId) { editError = 'Paste a folder URL, charmiq://folder/… URI, or folder id'; render(); return; }
  let name;
  try { name = await resolveFolderName(folderId); }
  catch(error) { editError = `Cannot read that folder: ${error?.message ?? error}`; render(); return; }

  // replacing an existing folder warns (loudly once clones exist); a first set is
  // not a change and commits silently
  if(state.config[spec.idKey]) {
    const loud = anyClones();
    const confirmed = await confirmModal({
      title: `Change ${spec.label}?`,
      bodyHtml: `${changeFolderWarning(field)}<p>New ${spec.label}: <strong>${esc(name)}</strong></p>`,
      confirmLabel: 'Change folder',
      loud,
      typeToConfirm: loud ? 'change' : null,
    });
    if(!confirmed) return;
  }

  editingField = null; editError = null;
  await persist(s => { s.config[spec.idKey] = folderId; s.config[spec.nameKey] = name; return s; });
};

const savePatternEdit = async (rawValue) => {
  const pattern = String(rawValue || '').trim();
  if(!pattern.includes('{name}')) { editError = 'The pattern must contain {name}'; render(); return; }
  // the warning protects folders already created from the pattern; before any
  // clone exists the change commits silently
  if(anyClones()) {
    const confirmed = await confirmModal({
      title: 'Change Student Folder Name?',
      bodyHtml: `<p>The name pattern names each student's folder at clone time. Folders already created <strong>keep their current names</strong>; only future clones use the new pattern.</p><p>New pattern: <strong>${esc(pattern)}</strong></p>`,
      confirmLabel: 'Change name',
      loud: true,
      typeToConfirm: 'change',
    });
    if(!confirmed) return;
  }
  editingField = null; editError = null;
  await persist(s => { s.config.folderNamePattern = pattern; return s; });
};

const addOwner = async (user) => {
  if(state.config.owners.some(o => o.userId === user.userId)) { toast(`${user.name} is already an Owner`); return; }
  ownerPickerOpen = false;
  await persist(s => { s.config.owners = [...s.config.owners, user]; return s; });
};

const removeOwner = async (userId) => {
  const owner = state.config.owners.find(o => o.userId === userId);
  if(!owner) return;
  const confirmed = await confirmModal({
    title: 'Remove Owner?',
    bodyHtml: `<p><strong>${esc(owner.name)}</strong> will not be added to folders cloned from now on. Folders already shared with them are <strong>not</strong> changed.</p>`,
    confirmLabel: 'Remove',
  });
  if(!confirmed) return;
  await persist(s => { s.config.owners = s.config.owners.filter(o => o.userId !== userId); return s; });
};

// == Roster actions ==============================================================
const addStudentRow = async () => {
  const name = addStudent.name.trim();
  const user = addStudent.user;
  if(!name || !user) return;
  addStudent = { name: '', user: null };
  await persist(s => {
    s.students = [...s.students, {
      id: generateId(), name, userId: user.userId, email: user.email, profileName: user.name,
      deleted: false, folderId: null, folderName: null, clonedAt: null, mapping: {},
    }];
    return s;
  });
};

const markStudentDeleted = async (studentId, deleted) => {
  const student = state.students.find(s => s.id === studentId);
  if(!student) return;
  if(deleted) {
    const confirmed = await confirmModal({
      title: 'Mark student deleted?',
      bodyHtml: `<p><strong>${esc(student.name)}</strong> stays in the list (grayed out) and their cloned folder is untouched. This can be undone with Restore.</p>`,
      confirmLabel: 'Mark deleted',
    });
    if(!confirmed) return;
  }
  await persist(s => { s.students = s.students.map(st => st.id === studentId ? { ...st, deleted } : st); return s; });
};

// creates private Agents for the student from their cloned Charm copies
// (noDuplicate makes re-imports idempotent); Admin / DefaultAgentAdmin only —
// the server enforces the role regardless of the button gate. The detailed
// result stamps agentImportedAt per entry: created and already-exists both
// mean the student has an Agent for that Charm
const charmEntriesOf = (student) => Object.entries(student.mapping).filter(([templateUri]) => uriScope(templateUri) === 'charm');

const importCharms = async (studentId) => {
  if(busyStudentId) return;
  const student = state.students.find(s => s.id === studentId);
  if(!student || student.deleted) return;
  const charmEntries = charmEntriesOf(student);
  if(charmEntries.length < 1) { toast(`${student.name}: no cloned Charms to import`); return; }
  busyStudentId = studentId;
  setProgress(studentId, 'Importing Charms…');
  try {
    const result = await execCommand('admin.agent.create', { targetUserId: student.userId, promptTemplateIds: charmEntries.map(([, entry]) => entry.copyId), visibility: 'private', noDuplicate: true });
    // stamp what the server confirmed; an unrecognized result shape stamps
    // everything sent (the call succeeded as a whole)
    const reportedIds = new Set((Array.isArray(result?.results) ? result.results : []).map(item => item.promptTemplateId));
    const stampedAt = new Date().toISOString();
    const mapping = { ...student.mapping };
    for(const [templateUri, entry] of charmEntries) {
      if((reportedIds.size > 0) && !reportedIds.has(entry.copyId)) continue;
      mapping[templateUri] = { ...entry, agentImportedAt: stampedAt };
    }
    await persist(s => { s.students = replaceStudent(s.students, { ...student, mapping }); return s; });
    const summary = result?.summary;
    toast(summary
      ? `${student.name}: ${summary.created} Charm Agent${summary.created === 1 ? '' : 's'} created, ${summary.alreadyExists} already existed`
      : `${student.name}: imported ${charmEntries.length} Charm${charmEntries.length === 1 ? '' : 's'}`);
  } catch(error) {
    toast(`${student.name}: Charm import failed — ${error?.message ?? error}`, { error: true });
  } finally {
    busyStudentId = null;
    setProgress(studentId, null);
  }
};

// == Render ======================================================================
// the editor floats over the row (never reflows the list); the row underneath
// stays rendered at its standing height
const editPopoverHtml = ({ placeholder = '', value = '', hint = null }) => `
  <div class="edit-popover">
    <div class="config-edit">
      <input type="text" id="edit-input" placeholder="${esc(placeholder)}" value="${esc(value)}">
      <button class="primary small" data-action="save-edit">Save</button>
      <button class="small" data-action="cancel-edit">Cancel</button>
    </div>
    ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
    ${editError ? `<div class="inline-error">${esc(editError)}</div>` : ''}
  </div>`;

const folderRowHtml = (field) => {
  const spec = FOLDER_FIELDS[field];
  const folderId = state.config[spec.idKey];
  const name = state.config[spec.nameKey];
  return `
    <div class="config-row">
      <div class="config-label">${esc(spec.label)}</div>
      <div class="config-value">
        ${folderId
          ? `<a class="folder-link" href="${esc(folderWebUrl(folderId))}" target="_blank" rel="noopener" title="${esc(name || folderId)}"><span class="name">${esc(name || folderId)}</span>${icon('openInNew')}</a>`
          : `<span class="unset">Not set — click the pencil</span>`}
        <button class="icon" data-action="edit" data-field="${field}" title="Change ${esc(spec.label)}">${icon('edit')}</button>
      </div>
      ${(editingField === field) ? editPopoverHtml({ placeholder: 'Paste the folder URL (…/folder/…) or id' }) : ''}
    </div>`;
};

const patternRowHtml = () => `
  <div class="config-row">
    <div class="config-label">Student Folder Name</div>
    <div class="config-value">
      <span class="name">${esc(state.config.folderNamePattern)}</span>
      <button class="icon" data-action="edit" data-field="pattern" title="Change the Student Folder Name">${icon('edit')}</button>
    </div>
    ${(editingField === 'pattern') ? editPopoverHtml({ value: state.config.folderNamePattern, hint: `{name} is replaced with the student's name` }) : ''}
  </div>`;

const ownersRowHtml = () => `
  <div class="config-row">
    <div class="config-label">Folder Owners</div>
    <div style="flex:1 1 auto; min-width:0;">
      <div class="chips">
        ${state.config.owners.map(owner => `
          <span class="chip" title="${esc(`${owner.name} · ${owner.email}`)}">
            <span class="chip-name">${esc(owner.name)}</span>
            <span class="chip-email">${esc(owner.email)}</span>
            <button class="icon" data-action="remove-owner" data-user-id="${esc(owner.userId)}" title="Remove">${icon('close')}</button>
          </span>`).join('')}
        ${ownerPickerOpen
          ? `<span class="field" style="position:relative; min-width:240px;"><input type="text" id="owner-picker-input" placeholder="Search Platform Users…"><div class="typeahead-menu" id="owner-picker-menu" style="display:none;"></div></span>
             <button class="small" data-action="close-owner-picker">Cancel</button>`
          : `<button class="small" data-action="open-owner-picker" ${services.userProfile ? '' : 'disabled title="User search is unavailable — the platform userProfile.search scope has not shipped yet"'}>Add Owner</button>`}
      </div>
      <div class="hint">Added as Owner on each student folder at clone time; changing this never rewrites already-cloned folders</div>
    </div>
  </div>`;

// visual sort only — the persisted roster order is never touched. The clicked
// column is the primary key (direction applies to it alone); the remaining chain
// follows in fixed order, natural direction, so the order is always total:
// name A→Z, then email, then cloned before not-cloned, then active before deleted
const SORT_CHAIN = ['name', 'user', 'cloned', 'status'];
const SORT_COMPARATORS = {
  name: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }),
  user: (a, b) => (a.email || '').localeCompare(b.email || '', undefined, { sensitivity: 'base' })
               || (a.profileName || '').localeCompare(b.profileName || '', undefined, { sensitivity: 'base' }),
  cloned: (a, b) => (Object.keys(b.mapping).length > 0 ? 1 : 0) - (Object.keys(a.mapping).length > 0 ? 1 : 0),
  status: (a, b) => (a.deleted ? 1 : 0) - (b.deleted ? 1 : 0),
};
const sortedStudents = () => {
  const chain = [sort.key, ...SORT_CHAIN.filter(key => key !== sort.key)];
  return [...state.students].sort((a, b) => {
    for(const key of chain) {
      const comparison = SORT_COMPARATORS[key](a, b);
      if(comparison !== 0) return (key === sort.key) ? comparison * sort.dir : comparison;
    }
    return a.id.localeCompare(b.id)/*total-order backstop*/;
  });
};

const headerCellHtml = (key, label, style) =>
  `<th style="${style}" data-sort-key="${key}">${label}${sort.key === key ? icon(sort.dir === 1 ? 'expandLess' : 'expandMore') : ''}</th>`;

const studentRowHtml = (student) => {
  const cloneCount = Object.keys(student.mapping).length;
  const outOfSyncCount = Object.values(student.mapping).filter(entry => entry.outOfSync).length;
  const charmEntries = charmEntriesOf(student).map(([, entry]) => entry);
  const charmsImported = charmEntries.filter(entry => entry.agentImportedAt).length;
  const charmsPending = charmEntries.length - charmsImported;
  const lastCharmImportAt = charmEntries.reduce((latest, entry) => ((entry.agentImportedAt ?? '') > latest) ? entry.agentImportedAt : latest, '');
  const progress = progressText.get(student.id);
  const busy = busyStudentId !== null;
  const problem = configProblem();
  const statusSubParts = [];
  if(charmEntries.length > 0) statusSubParts.push(`<span class="${charmsPending > 0 ? 'status-outofsync' : ''}" title="${esc(`${charmsImported} of ${charmEntries.length} cloned Charm${charmEntries.length === 1 ? '' : 's'} imported as Agents`)}">Charms ${charmsImported}/${charmEntries.length}</span>`);
  if(student.clonedAt) statusSubParts.push(esc(formatDate(student.clonedAt)));
  if(student.folderId) statusSubParts.push(`<a class="folder-link" href="${esc(folderWebUrl(student.folderId))}" target="_blank" rel="noopener">open ${icon('openInNew')}</a>`);
  const statusMain = progress
    ? `<span class="status-progress">${esc(progress)}</span>`
    : cloneCount > 0
      ? `<span class="status-cloned">${cloneCount} item${cloneCount === 1 ? '' : 's'} cloned</span>${outOfSyncCount > 0 ? ` <span class="status-outofsync" title="Copies deliberately left diverged from the template (student-edited, admin chose to leave them)">· ${outOfSyncCount} out of sync</span>` : ''}`
      : `<span class="sub">Not cloned</span>`;
  const statusHtml = `<div class="status-main trunc">${statusMain}</div><div class="sub trunc">${statusSubParts.join(' · ') || '&nbsp;'}</div>`;
  return `
    <tr class="${student.deleted ? 'deleted' : ''}">
      <td><span class="student-name trunc" title="${esc(student.name)}">${esc(student.name)}</span></td>
      <td><div class="trunc" title="${esc(student.profileName)}">${esc(student.profileName)}</div><div class="sub trunc" title="${esc(student.email)}">${esc(student.email)}</div></td>
      <td>${statusHtml}</td>
      <td>
        <div class="row-actions">
          ${student.deleted
            ? `<button class="small" data-action="restore-student" data-student-id="${esc(student.id)}">Restore</button>`
            : `<button class="small primary" data-action="clone-student" data-student-id="${esc(student.id)}" ${(busy || problem) ? 'disabled' : ''} ${problem ? `title="${esc(problem.message)}"` : ''}>${cloneCount > 0 ? 'Re-clone' : 'Clone'}</button>
               ${canImportCharms() ? `<button class="small" data-action="import-charms" data-student-id="${esc(student.id)}" ${busy ? 'disabled' : ''} title="${esc(charmEntries.length > 0 ? `${charmsImported} of ${charmEntries.length} Charm${charmEntries.length === 1 ? '' : 's'} imported${lastCharmImportAt ? ` · last ${formatDate(lastCharmImportAt)}` : ''}` : 'Create private Agents for this student from their cloned Charms')}">Import Charms</button>` : ''}
               <button class="icon" data-action="delete-student" data-student-id="${esc(student.id)}" ${busy ? 'disabled' : ''} title="Mark deleted">${icon('delete')}</button>`}
        </div>
      </td>
    </tr>`;
};

const render = () => {
  const app = document.getElementById('app');
  if(!window.charmiq) {
    app.innerHTML = `<div class="banner error">This application must run embedded in a CharmIQ document.</div>`;
    return;
  }
  if(!state) { app.innerHTML = `<div class="banner">Loading…</div>`; return; }

  // innerHTML replacement destroys the scroller — carry its position across
  const scrollTop = app.querySelector('.table-scroll')?.scrollTop ?? 0;

  const problem = configProblem();
  app.innerHTML = `
    ${services.command ? '' : `<div class="banner error">The Command service is unavailable — cloning is disabled. Check the application's granted permissions and reload.</div>`}
    <div class="card">
      <div class="card-header">
        <h2>Workshop Configuration</h2>
        <button class="icon" data-action="toggle-config" title="${configCollapsed ? 'Expand' : 'Collapse'}">${icon(configCollapsed ? 'expandMore' : 'expandLess')}</button>
      </div>
      ${configCollapsed ? '' : `
      <div class="card-body">
        ${folderRowHtml('template')}
        ${folderRowHtml('classroom')}
        ${patternRowHtml()}
        ${ownersRowHtml()}
      </div>`}
    </div>
    <div class="card roster-card">
      <div class="card-header">
        <h2>Students</h2>
        <span class="sub" style="color:var(--gray-500); font-size:13px;">${state.students.filter(s => !s.deleted).length} active</span>
      </div>
      <div class="card-body">
        ${problem ? `<div class="banner${problem.severity === 'error' ? ' error' : ''}" style="margin-bottom:12px;">${esc(problem.message)}</div>` : ''}
        <div class="table-scroll">
        <table>
          <thead><tr>${headerCellHtml('name', 'Student', 'width:22%;')}${headerCellHtml('user', 'CharmIQ User', 'width:26%;')}${headerCellHtml('cloned', 'Status', 'width:26%;')}${headerCellHtml('status', 'Actions', 'width:26%; text-align:right;')}</tr></thead>
          <tbody>
            ${state.students.length ? sortedStudents().map(studentRowHtml).join('') : `<tr><td colspan="4"><span class="sub">No students yet — add the first one below.</span></td></tr>`}
          </tbody>
        </table>
        </div>
        <div class="add-row">
          <div class="field"><input type="text" id="add-name" placeholder="Student name" value="${esc(addStudent.name)}"></div>
          <div class="field">
            ${addStudent.user
              ? `<div class="selected-user"><div class="who"><div class="n" title="${esc(addStudent.user.name)}">${esc(addStudent.user.name)}</div><div class="e" title="${esc(addStudent.user.email)}">${esc(addStudent.user.email)}</div></div><button class="icon" data-action="clear-add-user" title="Clear">${icon('close')}</button></div>`
              : `<input type="text" id="add-user-input" placeholder="Search Platform Users (name or exact email)…" ${services.userProfile ? '' : 'disabled title="User search is unavailable — the platform userProfile.search scope has not shipped yet"'}>
                 <div class="typeahead-menu" id="add-user-menu" style="display:none;"></div>`}
          </div>
          <button class="primary" data-action="add-student" ${addStudent.name.trim() && addStudent.user ? '' : 'disabled'}>Add student</button>
        </div>
        ${services.userProfile ? '' : `<div class="hint">Adding students requires Platform user search, which this application has not been granted yet.</div>`}
      </div>
    </div>`;

  const scroller = app.querySelector('.table-scroll');
  if(scroller) scroller.scrollTop = scrollTop;

  bindEvents(app);
};

// -- Event wiring ----------------------------------------------------------------
const bindEvents = (app) => {
  app.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    el.addEventListener('click', () => {
      if(action === 'edit') { editingField = el.dataset.field; editError = null; render(); document.getElementById('edit-input')?.focus(); }
      else if(action === 'toggle-config') { configCollapsed = !configCollapsed; render(); }
      else if(action === 'cancel-edit') { editingField = null; editError = null; render(); }
      else if(action === 'save-edit') {
        const value = document.getElementById('edit-input')?.value ?? '';
        if(editingField === 'pattern') savePatternEdit(value); else saveFolderEdit(editingField, value);
      }
      else if(action === 'open-owner-picker') { ownerPickerOpen = true; render(); document.getElementById('owner-picker-input')?.focus(); }
      else if(action === 'close-owner-picker') { ownerPickerOpen = false; render(); }
      else if(action === 'remove-owner') removeOwner(el.dataset.userId);
      else if(action === 'add-student') addStudentRow();
      else if(action === 'clear-add-user') { addStudent = { ...addStudent, user: null }; render(); }
      else if(action === 'clone-student') cloneStudent(el.dataset.studentId);
      else if(action === 'import-charms') importCharms(el.dataset.studentId);
      else if(action === 'delete-student') markStudentDeleted(el.dataset.studentId, true);
      else if(action === 'restore-student') markStudentDeleted(el.dataset.studentId, false);
    });
  });

  app.querySelectorAll('th[data-sort-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sortKey;
      sort = (sort.key === key) ? { key, dir: -sort.dir } : { key, dir: 1 };
      render();
    });
  });

  const editInput = document.getElementById('edit-input');
  if(editInput) editInput.addEventListener('keydown', (event) => {
    if(event.key === 'Enter') (editingField === 'pattern' ? savePatternEdit : (v) => saveFolderEdit(editingField, v))(editInput.value);
    if(event.key === 'Escape') { editingField = null; editError = null; render(); }
  });

  const addNameInput = document.getElementById('add-name');
  if(addNameInput) addNameInput.addEventListener('input', () => {
    addStudent = { ...addStudent, name: addNameInput.value };
    // enable/disable Add without a full re-render (the input keeps focus)
    const addButton = app.querySelector('[data-action="add-student"]');
    if(addButton) addButton.disabled = !(addStudent.name.trim() && addStudent.user);
  });

  const addUserInput = document.getElementById('add-user-input');
  if(addUserInput) attachUserTypeahead(addUserInput, document.getElementById('add-user-menu'), (user) => {
    addStudent = { ...addStudent, user };
    render();
    document.getElementById('add-name')?.focus();
  });

  const ownerInput = document.getElementById('owner-picker-input');
  if(ownerInput) attachUserTypeahead(ownerInput, document.getElementById('owner-picker-menu'), addOwner);
};

// == Boot ========================================================================
const boot = async () => {
  render()/*loading shell*/;
  if(!window.charmiq) return;

  try { services.command = await window.charmiq.discover('charmiq.service.command'); }
  catch { services.command = null; }
  try { services.userProfile = await window.charmiq.discover('charmiq.service.user-profile'); }
  catch { services.userProfile = null; }
  try {
    services.authUser = await window.charmiq.discover('charmiq.service.auth-user');
    let lastRolesJson = '';
    services.authUser?.onAuthUser$?.().subscribe?.((value) => {
      authState = value;
      // role-gated buttons appear when the roles arrive; re-render only on a
      // role change (auth state emits more often than roles change)
      const rolesJson = JSON.stringify(value?.userRoles ?? {});
      if(rolesJson !== lastRolesJson) { lastRolesJson = rolesJson; render(); }
    });
  } catch { services.authUser = null; }

  try {
    const raw = await window.charmiq.appState.get();
    // a configured embed opens with the configuration collapsed; a fresh one open
    configCollapsed = (raw != null) && ((typeof raw !== 'object') || (Object.keys(raw).length > 0));
    state = normalizeState(raw);
    lastWrittenJson = JSON.stringify(state);
  } catch(error) {
    state = defaultState();
    toast(`Could not load saved state: ${error?.message ?? error}`, { error: true });
  }

  // a click outside the floating editor (and outside any confirm modal) cancels it
  document.addEventListener('mousedown', (event) => {
    if(!editingField) return;
    const target = event.target;
    if(target.closest('.edit-popover') || target.closest('[data-action="edit"]') || target.closest('.modal-overlay')) return;
    editingField = null; editError = null; render();
  });

  // live refresh for other open copies of this page; own writes echo back and are
  // suppressed by content equality
  try {
    window.charmiq.appState.onChange$().subscribe((incoming) => {
      const normalized = normalizeState(incoming);
      const json = JSON.stringify(normalized);
      if(json === lastWrittenJson) return;
      state = normalized;
      lastWrittenJson = json;
      render();
    });
  } catch { /* live refresh unavailable; explicit actions still re-render */ }

  render();
};

boot();
})();
</script>
